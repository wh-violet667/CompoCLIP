# E4c: LoRA（q/v 投影，r=8）
# 训练后额外导出 epoch{n}_merged.pt，键名与基座一致，评测直接用它
model: ViT-B-32
pretrained: laion2b_s34b_b79k

train_data: data/flickr30k/splits/train.jsonl
hardneg_data: data/hardneg/llm_generated.jsonl   # 换成胜出的负例来源
val_data: data/flickr30k/splits/val.jsonl
val_limit: 300

batch_size: 128
accum_freq: 2
num_workers: 4
epochs: 4
lr: 1.0e-4               # LoRA 常用更高 lr；先跑 100 step 观察 loss 是否抖动
warmup: 200
wd: 0.1
lr_scheduler: cosine
grad_clip: 1.0
precision: amp
grad_checkpointing: false
logit_scale_clamp: 100.0

hard_negative_weight: 1.0
distill_lambda: 0.0
kd_temperature: 1.0
distill_teacher_cache: caches/teacher_f30k.pt

strategy: lora
lora_r: 8
lora_alpha: 16

resume:

output_dir: runs/e4c
