# E3: 复用 E2 负例 + 原始 CLIP 教师蒸馏（lambda=0.5）
# 学生从原始 CLIP 独立初始化，不从 E2 resume；E4a 才直接复用 E2/E-best checkpoint
model: ViT-B-32
pretrained: laion2b_s34b_b79k

train_data: data/flickr30k/splits/train.jsonl
hardneg_data: data/hardneg/llm_generated.jsonl   # 按 E1/E2/E2a 的胜出者替换
val_data: data/flickr30k/splits/val.jsonl
val_limit: 300

batch_size: 64
accum_freq: 4
num_workers: 4
epochs: 4
lr: 1.0e-5
warmup: 200
wd: 0.1
lr_scheduler: cosine
grad_clip: 1.0
precision: amp
seed: 42
grad_checkpointing: false
logit_scale_clamp: 100.0

hard_negative_weight: 1.0
distill_lambda: 0.5        # 消融 {0, 0.5}；λ=0 等价于 E2 的同数据训练设置（不是复用 E2 权重）
kd_temperature: 2.0        # 教师分布比学生更平滑，避免 softmax 过尖
distill_teacher_cache: caches/teacher_f30k.pt

strategy: full
lora_r: 8
lora_alpha: 16

resume:

output_dir: runs/e3
