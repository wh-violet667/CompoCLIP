# E2: LLM 负例 + 硬负例加权 InfoNCE，全量微调
# 其余实验组复制本文件后按 docs/dev-doc.md §1 改动对应字段
model: ViT-B-32
pretrained: laion2b_s34b_b79k

train_data: data/flickr30k/splits/train.jsonl
hardneg_data: data/hardneg/llm_generated.jsonl   # E1 改 rule_based.jsonl；E2a 改 adversarial_filtered.jsonl
val_data: data/flickr30k/splits/val.jsonl
val_limit: 300             # 每 epoch 验证只用前 300 张图，控制监控开销

batch_size: 128            # T4 16GB 实测上限附近；OOM 则降 96
accum_freq: 2              # 等效 batch 256
num_workers: 4
epochs: 4                  # 先 100 step 实测吞吐再最终敲定
lr: 1.0e-5
warmup: 200                # 优化器 step 数（非 batch 数）
wd: 0.1
lr_scheduler: cosine
grad_clip: 1.0
precision: amp             # T4 无 bf16：fp16 + GradScaler
grad_checkpointing: false  # 仅 ViT-B/16（E5）时开启
logit_scale_clamp: 100.0   # 1/tau 上限（logit_scale 参数本身裁到 ln(100)）

hard_negative_weight: 1.0
distill_lambda: 0.0        # E3 改 0.5
kd_temperature: 1.0
distill_teacher_cache: caches/teacher_f30k.pt

# 微调策略（E4）：full | lock_image | lora
strategy: full
lora_r: 8                  # 仅 strategy: lora 时生效
lora_alpha: 16

# 断点续训：填 checkpoint 路径即可（也可用 --resume 覆盖）
resume:

output_dir: runs/e2
