# E4b: 锁图像塔（只训文本塔）
# 与 E2/E-best 同一最佳数据配置，仅策略不同；用于创新点 3 的帕累托矩阵
model: ViT-B-32
pretrained: laion2b_s34b_b79k

train_data: data/flickr30k/splits/train.jsonl
hardneg_data: data/hardneg/llm_generated.jsonl   # 换成胜出的负例来源
val_data: data/flickr30k/splits/val.jsonl
val_limit: 300

batch_size: 128
accum_freq: 2
num_workers: 4
epochs: 4
lr: 1.0e-5
warmup: 200
wd: 0.1
lr_scheduler: cosine
grad_clip: 1.0
precision: amp
grad_checkpointing: false
logit_scale_clamp: 100.0

hard_negative_weight: 1.0
distill_lambda: 0.0
kd_temperature: 1.0
distill_teacher_cache: caches/teacher_f30k.pt

strategy: lock_image
lora_r: 8
lora_alpha: 16

resume:

output_dir: runs/e4b
